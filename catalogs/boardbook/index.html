<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1"/>
 <title>Board Book Catalogue</title>
 <link rel="stylesheet" href="../../magazines/viewer.css"/>
</head>
<body>
 <main class="reader" id="myd-free-drag">
  <header><div><strong>Board Book Catalogue</strong><span class="reader-note">Complete catalogue</span></div><button class="zoom-button" type="button">Enlarge</button></header>
  <div class="stage"><div class="volume" aria-live="polite"></div></div>
  <footer><button class="prev" type="button">← Previous</button><span class="status">Cover</span><button class="next" type="button">Open →</button></footer>
  <dialog><button class="close-dialog" type="button">×</button><img alt="Enlarged catalogue page"/></dialog>
 </main>
 <script src="pages.js"></script>
 <script src="../../magazines/viewer.js"></script>
</body>
</html>
